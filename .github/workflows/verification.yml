name: Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: ./scripts/verify-project.ps1 -Suite sql
      - run: node --test tests/hashline.test.mjs tests/tool-profile.test.mjs tests/retry-limit.test.mjs
      - name: Pi RPC and sync regression
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'astra-pi'
          $pin = Get-Content manifests/packages.json -Raw | ConvertFrom-Json
          npm install --prefix $runtime --ignore-scripts --no-audit --no-fund "$($pin.pi.package)@$($pin.pi.version)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$(Join-Path $runtime 'node_modules/.bin');$env:PATH"
          $cli = Join-Path $runtime "node_modules/$($pin.pi.package)/dist/cli.js"
          node tests/mode-rpc.mjs $cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/retry-limit-rpc.mjs $cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/sync.ps1
          exit $LASTEXITCODE
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore examples/dotnet/Notes.Tests.csproj --locked-mode
      - run: ./scripts/verify-project.ps1 -Suite dotnet
  vue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/vue
      - run: ./scripts/verify-project.ps1 -Suite vue
