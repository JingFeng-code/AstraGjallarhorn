name: Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: ./scripts/verify-project.ps1 -Suite sql
      - run: node --test tests/hashline.test.mjs tests/tool-profile.test.mjs
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore examples/dotnet/Notes.Tests.csproj --locked-mode
      - run: ./scripts/verify-project.ps1 -Suite dotnet
  vue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/vue
      - run: ./scripts/verify-project.ps1 -Suite vue
