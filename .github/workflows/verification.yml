name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: node examples/sql/verify.mjs
      - run: node --test examples/sql/verify.test.mjs
